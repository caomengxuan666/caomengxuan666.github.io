name: Blog post draft
description: Submit material for a blog post
title: "[post] "
labels:
  - blog-post
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: Use a concrete repo / release / commit topic.
      placeholder: "cxxmcp v1.1.2: release gates need evidence"
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Slug
      placeholder: "cxxmcp-release-gates"
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      placeholder: "cxxmcp, ci, release"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Commit / release / issue / PR links.
      placeholder: "https://github.com/..."
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Draft body
      description: Background, change, validation, remaining work.
    validations:
      required: true
